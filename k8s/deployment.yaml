apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-task
  namespace: devops-task
  labels: { app: devops-task }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # never drop below desired capacity
      maxSurge: 1         # bring up one new pod first
  selector:
    matchLabels: { app: devops-task }
  template:
    metadata:
      labels: { app: devops-task }
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: devops-task:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: devops-task-config }
            - secretRef: { name: devops-task-secrets, optional: true }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
          readinessProbe:       # gates traffic: pod only receives requests once /health is OK
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:        # restarts a wedged process; slower/looser than readiness on purpose
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:            # let the Service/Ingress drop the endpoint before SIGTERM
              exec: { command: ["sleep", "5"] }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
