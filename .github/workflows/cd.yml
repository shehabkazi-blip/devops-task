name: CD
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once, and never cancel one mid-flight.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && pytest

  build-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC
      contents: read
    outputs:
      image_tag: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute tags
        id: ver
        run: |
          echo "version=$(cat VERSION).${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::279849615230:role/devops-task-ci-push
          aws-region: us-west-2

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: ./app
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/devops-task:${{ steps.ver.outputs.version }}
            ${{ steps.ecr.outputs.registry }}/devops-task:${{ steps.ver.outputs.sha }}
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    needs: build-push
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      image_tag: ${{ needs.build-push.outputs.image_tag }}

  deploy-production:
    # Skipped until a production environment exists. Set repo variable ENABLE_PRODUCTION=true to turn it on.
    if: ${{ vars.ENABLE_PRODUCTION == 'true' }}
    needs: [build-push, deploy-staging]
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production      # configure required reviewers on this GitHub environment
      image_tag: ${{ needs.build-push.outputs.image_tag }}