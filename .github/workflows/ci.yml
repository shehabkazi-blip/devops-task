name: CI
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests + coverage
        run: pytest
      - name: Coverage summary
        run: python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: app/coverage.xml

  lint-docker-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile
      - name: shellcheck
        run: shellcheck scripts/*.sh

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.3
      - run: terraform fmt -check -recursive terraform
      - name: validate (stack + bootstrap)
        run: |
          for d in terraform terraform/bootstrap; do
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
          done

  build-scan:
    runs-on: ubuntu-latest
    env:
      TRIVY_IMAGE: aquasec/trivy:0.70.0
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (loaded locally, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: ./app
          load: true
          tags: devops-task:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy - informational report (HIGH and CRITICAL)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            "$TRIVY_IMAGE" image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 devops-task:pr
      - name: Trivy - gate (fail on CRITICAL)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            "$TRIVY_IMAGE" image --severity CRITICAL --ignore-unfixed --exit-code 1 devops-task:pr