name: Deploy (reusable)
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      image_tag:
        type: string
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}   # environment-scoped variable
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy over SSM (instance rolls itself back if the smoke test fails)
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}           # environment-scoped variable
          IMAGE_TAG: ${{ inputs.image_tag }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          CMD="cd /opt/app && git fetch --depth 1 origin ${GIT_SHA} && git checkout --force ${GIT_SHA} && ./scripts/deploy.sh ${IMAGE_TAG}"
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${IMAGE_TAG} to ${{ inputs.environment }}" \
            --timeout-seconds 900 \
            --parameters "$(jq -cn --arg c "$CMD" '{commands: [$c]}')" \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"

          STATUS=Pending
          for _ in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
                       --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done

          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text >&2
          [ "$STATUS" = "Success" ] || { echo "Deploy ended with status: $STATUS" >&2; exit 1; }
