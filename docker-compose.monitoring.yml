# Observability stack. Use together with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d --build
# Only Grafana (3000) and the app (8080) publish ports.
# Everything else talks over the project's default (internal) Docker network.
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 512M }

  loki:
    image: grafana/loki:3.3.2
    container_name: loki
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 384M }

  alloy:
    image: grafana/alloy:v1.5.1
    container_name: alloy
    # root is needed to read /var/run/docker.sock. The socket is effectively root on the
    # host: see README "Security Considerations" for the trade-off.
    user: root
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on: [loki]
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 256M }

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    # Runs on the internal network (no published port). CPU, memory and disk come from the
    # host through the read-only /proc, /sys and / mounts. Network counters show the
    # container's own interface; see README "Observability" for this trade-off.
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.10", memory: 64M }

  cadvisor:
    # v0.49.1 cannot talk to Docker 29 ("client version 1.41 is too old"), so container names
    # are missing. If this tag cannot be pulled, use gcr.io/cadvisor/cadvisor:v0.49.1 again.
    image: ghcr.io/google/cadvisor:v0.53.0
    container_name: cadvisor
    # Upstream-documented privileges: read-only host mounts, privileged, /dev/kmsg.
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 256M }

  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus, loki]
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 320M }

volumes:
  prometheus-data:
  loki-data:
  alloy-data:
  grafana-data: